name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nvidia-bios-reader-windows-x64
            paths: |
              build/Release/nvidia-bios-reader.exe
              build/Release/nvidia-bios-reader-cli.exe
          - os: ubuntu-latest
            artifact: nvidia-bios-reader-linux-x64
            paths: build/nvidia-bios-reader-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload tested binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
